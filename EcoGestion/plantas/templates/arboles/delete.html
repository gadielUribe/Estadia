{% extends 'base.html' %}
<!-- delete.html: confirmación de eliminación de una planta o árbol -->

{% block title %}Eliminar planta{% endblock %}

{% block content %}

    <h1>Hola, estás en la página para eliminar un árbol.</h1>
    
    <p>Deseas eliminar arbol <strong>#{{ arbol.id_planta }} - {{ arbol.nombre_cientifico }}</strong></p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Eliminar árbol</button>
        <a href="{% url 'planta_inicio' %}"> Volver a Inicio </a>
    </form>
    
{% endblock %}
