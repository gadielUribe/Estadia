{% extends 'base.html' %}
<!-- confirm_delete_asignacion.html: confirma la eliminación de una asignación de herramienta -->
{% block title %}Eliminar asignación{% endblock %}
{% block content %}
<h1 class="h4">Eliminar asignación</h1>
<p>¿Seguro que deseas eliminar la asignación de "{{ asignacion.herramienta.nombre }}" a la tarea #{{ asignacion.tarea_id }}?</p>

<form method="post">
  {% csrf_token %}
  <a href="{% url 'herramientas:asignacion_list' %}" class="btn btn-outline-secondary">Cancelar</a>
  <button type="submit" class="btn btn-danger">Eliminar</button>
  </form>
{% endblock %}
